<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>กรอกข้อมูล - SmartGreenEnergy</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">
                <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                Smart<span>Green</span>Energy
            </div>
            <div class="nav-links">
                <a href="index.html">หน้าแรก</a>
                <a href="input.html" class="active">กรอกข้อมูล</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="recommend.html">คำแนะนำ</a>
                <a href="about.html">เกี่ยวกับเรา</a>
            </div>
        </nav>

        <h2 class="page-title">กรอกข้อมูลการใช้พลังงาน</h2>
        <p class="page-subtitle">ข้อมูลของคุณจะถูกเก็บไว้ในเครื่องเท่านั้น ปลอดภัย 100%</p>

        <form id="energyForm" onsubmit="event.preventDefault(); saveUserData();">
            <div class="form-row">
                <div class="form-group">
                    <label>ค่าไฟฟ้ารายเดือน <span class="required">*</span></label>
                    <input type="number" id="bill" placeholder="เช่น 50000" required />
                </div>
                <div class="form-group">
                    <label>ปริมาณการใช้ไฟฟ้า (kWh) <span class="required">*</span></label>
                    <input type="number" id="kwh" placeholder="เช่น 5000" required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>จังหวัด</label>
                    <select id="province">
                        <option value="">-- เลือก --</option>
                        <option>กรุงเทพฯ</option>
                        <option>เชียงใหม่</option>
                        <option>ขอนแก่น</option>
                        <option>ภูเก็ต</option>
                        <option>ชลบุรี</option>
                        <option>นครราชสีมา</option>
                        <option>เชียงราย</option>
                        <option>สงขลา</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ขนาดพื้นที่ (ตร.ม.)</label>
                    <input type="number" id="area" placeholder="เช่น 200" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ประเภทกิจการ <span class="required">*</span></label>
                    <select id="business" required>
                        <option value="">-- เลือก --</option>
                        <option value="ร้านอาหาร">ร้านอาหาร</option>
                        <option value="สำนักงาน">สำนักงาน</option>
                        <option value="โรงงาน">โรงงาน</option>
                        <option value="ห้างสรรพสินค้า">ห้างสรรพสินค้า</option>
                        <option value="โรงแรม">โรงแรม</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>งบประมาณลงทุน (บาท) <span class="required">*</span></label>
                    <input type="number" id="budget" placeholder="เช่น 500000" required />
                </div>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap;">
                <button type="submit" class="btn" style="flex: 1; min-width: 150px;">
                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    เริ่มวิเคราะห์
                </button>
                <button type="button" class="btn btn-secondary" onclick="loadSampleData()" style="flex: 0.5; min-width: 120px;">
                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    โหลดตัวอย่าง
                </button>
                <button type="reset" class="btn btn-secondary" style="flex: 0.3; min-width: 80px;">ล้าง</button>
            </div>

            <p style="text-align: center; color: #94a3b8; font-size: 13px; margin-top: 20px;">
                * ข้อมูลจะถูกบันทึกในเครื่องเพื่อแสดงผล Dashboard
            </p>
        </form>

        <footer>&copy; 2026 SmartGreenEnergy · Prototype Version</footer>
    </div>

    <script src="js/calculator.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
