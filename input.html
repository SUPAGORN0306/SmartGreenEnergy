<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Green Energy - บันทึกข้อมูล</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">Smart Green Energy</div>
        <ul class="sidebar-menu">
            <li><a href="index.html">หน้าหลัก</a></li>
            <li><a href="dashboard.html">ภาพรวมพลังงาน</a></li>
            <li class="active"><a href="input.html">บันทึกข้อมูลการใช้ไฟ</a></li>
            <li><a href="recommend.html">แนะนำการลงทุน</a></li>
            <li><a href="about.html">เกี่ยวกับเรา</a></li>
        </ul>
        <div class="sidebar-footer">2026 Smart Green Energy</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h1>กรอกข้อมูลการใช้พลังงาน</h1>
        </div>

        <div class="panel" style="max-width: 600px;">
            <h2 class="panel-title">ระบุข้อมูลกิจการหรืออาคารของคุณ</h2>
            <form onsubmit="event.preventDefault(); saveUserDataFromForm();">
                <div class="form-group">
                    <label for="business">ประเภทธุรกิจ</label>
                    <select id="business" class="form-control" onchange="fillDefaultExample(this.value)">
                        <option value="ร้านอาหาร">ร้านอาหาร</option>
                        <option value="สำนักงาน">สำนักงาน</option>
                        <option value="โรงงาน">โรงงาน</option>
                        <option value="ห้างสรรพสินค้า">ห้างสรรพสินค้า</option>
                        <option value="โรงแรม">โรงแรม</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bill">ค่าไฟฟ้าเฉลี่ยต่อเดือน (บาท)</label>
                    <input type="number" id="bill" class="form-control" value="25000" required>
                </div>
                <div class="form-group">
                    <label for="kwh">ปริมาณการใช้ไฟฟ้าเฉลี่ยต่อเดือน (kWh)</label>
                    <input type="number" id="kwh" class="form-control" value="2500" required>
                </div>
                <div class="form-group">
                    <label for="budget">งบประมาณลงทุนโครงการ (บาท)</label>
                    <input type="number" id="budget" class="form-control" value="200000" required>
                </div>
                <div class="form-group">
                    <label for="province">จังหวัด</label>
                    <input type="text" id="province" class="form-control" value="กรุงเทพมหานคร">
                </div>
                <div class="form-group">
                    <label for="area">พื้นที่ใช้สอย (ตารางเมตร)</label>
                    <input type="number" id="area" class="form-control" value="150">
                </div>
                <button type="submit" class="btn">บันทึกและคำนวณผล</button>
            </form>
        </div>
    </div>

    <script src="js/calculator.js"></script>
    <script src="js/main.js"></script>
    <script>
        function fillDefaultExample(type) {
            const examples = getBusinessExamples();
            if (examples[type]) {
                document.getElementById('bill').value = examples[type].bill;
                document.getElementById('kwh').value = examples[type].kwh;
                document.getElementById('budget').value = examples[type].budget;
            }
        }
    </script>
</body>
</html>
